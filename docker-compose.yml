
services:
  # ==========================================
  # gStreamGate 主應用程式
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-unknown}
    image: gstreamgate:latest
    container_name: gstreamgate-app
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web 管理介面 & REST API
      - "9092:9092"   # gRPC 代理端口
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      - TZ=Asia/Taipei
      - JAVA_OPTS=-Xms512m -Xmx2048m -XX:+UseG1GC -XX:+UseStringDeduplication
      # 資料庫配置 (生產環境使用 PostgreSQL)
      - DB_USERNAME=${DB_USERNAME:-gstreamgate}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-gStreamGateSecretKeyThatIsLongEnoughForHS256AlgorithmAndShouldBeChangedInProduction}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    volumes:
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gstreamgate-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "io.gstreamgate.service=app"
      - "io.gstreamgate.version=${VERSION:-latest}"

  # ==========================================
  # PostgreSQL 資料庫
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: gstreamgate-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-gstreamgate}
      - POSTGRES_USER=${DB_USERNAME:-gstreamgate}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gstreamgate} -d ${DB_NAME:-gstreamgate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gstreamgate-network
    labels:
      - "io.gstreamgate.service=database"

  # ==========================================
  # Prometheus 監控
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: gstreamgate-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"    # 調整端口避免衝突
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=http://localhost:9091'
    networks:
      - gstreamgate-network
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "io.gstreamgate.service=monitoring"

  # ==========================================
  # Grafana 儀表板
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: gstreamgate-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-gStreamGate123!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gstreamgate-network
    depends_on:
      - prometheus
    labels:
      - "io.gstreamgate.service=monitoring"

  # ==========================================
  # Redis 快取 (可選)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: gstreamgate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-gStreamGate}
    volumes:
      - redis_data:/data
    networks:
      - gstreamgate-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - redis
    labels:
      - "io.gstreamgate.service=cache"

  # ==========================================
  # Nginx 反向代理 (可選)
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: gstreamgate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - gstreamgate-network
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - nginx
    labels:
      - "io.gstreamgate.service=proxy"

# ==========================================
# 網路配置
# ==========================================
networks:
  gstreamgate-network:
    driver: bridge
    name: gstreamgate-network
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

# ==========================================
# 數據卷
# ==========================================
volumes:
  postgres_data:
    driver: local
    name: gstreamgate_postgres_data
  prometheus_data:
    driver: local
    name: gstreamgate_prometheus_data
  grafana_data:
    driver: local
    name: gstreamgate_grafana_data
  redis_data:
    driver: local
    name: gstreamgate_redis_data