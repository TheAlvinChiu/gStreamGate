// ==========================================
// 監控和日誌任務
// ==========================================
task watchLogs(type: Exec) {
    group = 'monitoring'
    description = 'Watch application logs in real-time'

    commandLine 'tail', '-f', 'logs/gstream-gate.log'

    onlyIf {
        file('logs/gstream-gate.log').exists()
    }

    doFirst {
        if (!file('logs/gstream-gate.log').exists()) {
            logger.warn("Log file not found. Start the application first.")
        } else {
            logger.info("Watching logs... Press Ctrl+C to stop")
        }
    }
}

task showRecentLogs {
    group = 'monitoring'
    description = 'Show recent application logs'

    doLast {
        def logFile = file('logs/gstream-gate.log')
        if (logFile.exists()) {
            logger.info("📄 Recent logs from: ${logFile}")
            logger.info("=" * 50)

            def lines = logFile.readLines()
            def recentLines = lines.size() > 100 ? lines.drop(lines.size() - 100) : lines

            recentLines.each { line ->
                println line
            }

            logger.info("=" * 50)
            logger.info("💡 Use './gradlew watchLogs' to monitor in real-time")
        } else {
            logger.warn("⚠️  Log file not found: ${logFile}")
            logger.info("💡 Start the application to generate logs")
        }
    }
}

// ==========================================
// 快速修復任務
// ==========================================
task quickFix {
    group = 'help'
    description = 'Quick fix for common issues'

    doLast {
        logger.info("🔧 Running quick fixes for common issues...")

        def fixes = []

        // 修復靜態資源目錄
        def staticDir = file('src/main/resources/static')
        if (!staticDir.exists()) {
            staticDir.mkdirs()
            file('src/main/resources/static/.gitkeep').createNewFile()
            fixes << "Created static resources directory"
        }

        // 修復日誌目錄
        def logsDir = file('logs')
        if (!logsDir.exists()) {
            logsDir.mkdirs()
            fixes << "Created logs directory"
        }

        // 清理臨時檔案
        def tempFiles = fileTree('.') {
            include '**/*.tmp'
            include '**/*.bak'
            include '**/.DS_Store'
        }

        if (!tempFiles.empty) {
            delete tempFiles
            fixes << "Cleaned temporary files"
        }

        // 修復權限（Unix 系統）
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            def gradlewFile = file('gradlew')
            if (gradlewFile.exists() && !gradlewFile.canExecute()) {
                gradlewFile.setExecutable(true)
                fixes << "Fixed gradlew permissions"
            }
        }

        if (fixes.isEmpty()) {
            logger.info("✅ No issues found - everything looks good!")
        } else {
            logger.info("✅ Applied fixes:")
            fixes.each { fix ->
                logger.info("  - ${fix}")
            }
        }

        logger.info("🔧 Quick fix completed")
    }
}

// 檢查依賴衝突
task checkDependencyConflicts {
    group = 'verification'
    description = 'Check for dependency conflicts'

    doLast {
        logger.info("🔍 Checking for dependency conflicts...")

        def conflicts = []
        configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            if (id.name.contains('logback') || id.name.contains('slf4j')) {
                conflicts << "${id.group}:${id.name}:${id.version}"
            }
        }

        if (conflicts.size() > 0) {
            logger.info("Logging dependencies found:")
            conflicts.each { dep ->
                logger.info("- ${dep}")
            }
        }

        logger.info("✅ Dependency conflict check completed")
    }
}

