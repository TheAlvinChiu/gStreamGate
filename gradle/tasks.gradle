// ==========================================
// 自定義任務和工具
// ==========================================

// 驗證依賴
task verifyDependencies {
    group = 'verification'
    description = 'Verify all dependencies can be resolved'

    doLast {
        try {
            configurations.compileClasspath.resolve()
            configurations.testCompileClasspath.resolve()
            logger.info("✅ All dependencies resolved successfully!")

            // 打印關鍵依賴版本
            def keyDeps = [
                    'Spring Boot': project.ext.springBootVersion,
                    'gRPC': project.ext.grpcVersion,
                    'Undertow': project.ext.undertowVersion,
                    'Jackson': project.ext.jacksonVersion
            ]

            logger.info("Key dependency versions:")
            keyDeps.each { name, version ->
                logger.info("- ${name}: ${version}")
            }

        } catch (Exception e) {
            logger.error("❌ Dependency resolution failed: ${e.message}")
            throw e
        }
    }
}

// 創建啟動腳本
task createStartScript {
    group = 'build'
    description = 'Create optimized startup script'
    dependsOn bootJar

    doLast {
        def scriptsDir = file("${buildDir}/scripts")
        scriptsDir.mkdirs()

        def frontendStatus = project.hasProperty('frontendEnabled') ?
                (project.frontendEnabled ? 'Yes' : 'No') : 'No'

        def startScript = file("${scriptsDir}/start.sh")
        startScript.text = """#!/bin/bash
# gStreamGate 優化啟動腳本
# Generated on: ${new Date()}

JVM_OPTS="-server \\
    -Xms512m \\
    -Xmx2048m \\
    -XX:+UseG1GC \\
    -XX:MaxGCPauseMillis=200 \\
    -XX:+UseStringDeduplication \\
    -Dio.netty.allocator.type=pooled \\
    -Dio.undertow.disable-file-system-watcher=true \\
    -Djava.awt.headless=true \\
    --add-opens=java.base/java.nio=ALL-UNNAMED"

UNDERTOW_OPTS="--server.undertow.threads.io=8 \\
    --server.undertow.threads.worker=64 \\
    --server.undertow.buffer-size=16384 \\
    --server.undertow.direct-buffers=true"

APP_OPTS="--spring.profiles.active=production \\
    --server.port=8080 \\
    --grpc.proxy.server.port=9191 \\
    \$UNDERTOW_OPTS"

JAR_FILE=\$(ls *.jar | head -n 1)

echo "🚀 Starting gStreamGate (Spring Boot ${project.ext.springBootVersion})"
echo "JAR: \$JAR_FILE"
echo "Frontend Included: ${frontendStatus}"
echo "============================================"

exec java \$JVM_OPTS -jar \$JAR_FILE \$APP_OPTS
"""
        startScript.setExecutable(true)

        // Windows 版本
        def startBat = file("${scriptsDir}/start.bat")
        startBat.text = """@echo off
REM gStreamGate Windows 啟動腳本
REM Generated on: ${new Date()}

set JVM_OPTS=-server -Xms512m -Xmx2048m -XX:+UseG1GC -Djava.awt.headless=true
set APP_OPTS=--spring.profiles.active=production --server.port=8080

for %%f in (*.jar) do set JAR_FILE=%%f

echo 🚀 Starting gStreamGate (Spring Boot ${project.ext.springBootVersion})
echo JAR: %JAR_FILE%
echo Frontend Included: ${frontendStatus}
echo ====================================

java %JVM_OPTS% -jar %JAR_FILE% %APP_OPTS%
"""

        logger.info("Created startup scripts:")
        logger.info("- Linux/Mac: ${startScript.absolutePath}")
        logger.info("- Windows: ${startBat.absolutePath}")
    }
}

// 診斷任務
task diagnose {
    group = 'help'
    description = 'Diagnose build environment and issues'

    doLast {
        logger.info("""
        ==========================================
        🔍 Build Environment Diagnosis
        ==========================================
        """)

        // 檢查 Java 環境
        def javaVersion = System.getProperty('java.version')
        def javaVendor = System.getProperty('java.vendor')
        def javaHome = System.getProperty('java.home')

        logger.info("Java Environment:")
        logger.info("- Version: ${javaVersion}")
        logger.info("- Vendor: ${javaVendor}")
        logger.info("- Home: ${javaHome}")

        // 檢查 Gradle 環境
        logger.info("\nGradle Environment:")
        logger.info("- Version: ${gradle.gradleVersion}")
        logger.info("- Home: ${gradle.gradleHomeDir}")
        logger.info("- User Home: ${gradle.gradleUserHomeDir}")

        // 檢查項目結構
        logger.info("\nProject Structure:")
        def importantDirs = [
                'src/main/java',
                'src/main/resources',
                'src/test/java',
                'frontend',
                'gradle'
        ]

        importantDirs.each { dir ->
            def dirFile = file(dir)
            logger.info("- ${dir}: ${dirFile.exists() ? '✅' : '❌'}")
        }

        // 檢查前端環境
        if (project.hasProperty('frontendEnabled')) {
            logger.info("\nFrontend Environment:")
            logger.info("- Enabled: ${project.frontendEnabled}")
            if (project.hasProperty('buildTool')) {
                logger.info("- Build Tool: ${project.buildTool}")
            }
            if (project.hasProperty('outputDir')) {
                logger.info("- Output Dir: ${project.outputDir}")
            }
        }

        // 檢查任務
        logger.info("\nCritical Tasks:")
        def criticalTasks = [
                'build', 'bootJar', 'test',
                'buildFrontendAssets', 'cleanFrontend'
        ]

        criticalTasks.each { taskName ->
            def task = tasks.findByName(taskName)
            logger.info("- ${taskName}: ${task ? '✅' : '❌'}")
        }

        // 記憶體狀態
        def runtime = Runtime.getRuntime()
        def maxMB = runtime.maxMemory() / 1024 / 1024
        def totalMB = runtime.totalMemory() / 1024 / 1024
        def freeMB = runtime.freeMemory() / 1024 / 1024

        logger.info("\nMemory Status:")
        logger.info("- Max: ${maxMB} MB")
        logger.info("- Total: ${totalMB} MB")
        logger.info("- Free: ${freeMB} MB")

        logger.info("\n==========================================")
    }
}

// 快速開發設置
task setupDev {
    group = 'setup'
    description = 'Setup development environment'
    dependsOn 'ensureStaticDir'

    doLast {
        logger.info("🔧 Setting up development environment...")

        // 創建日誌目錄
        def logsDir = file('logs')
        if (!logsDir.exists()) {
            logsDir.mkdirs()
            logger.info("✅ Created logs directory")
        }

        // 檢查前端設置
        if (project.hasProperty('frontendEnabled') && project.frontendEnabled) {
            logger.info("✅ Frontend environment ready")
        } else {
            logger.info("⚠️  Frontend not available. To set up:")
            logger.info("   1. Run: npx create-react-app frontend")
            logger.info("   2. Run: ./gradlew setupDev")
        }

        // 創建示例配置
        def configDir = file('config')
        if (!configDir.exists()) {
            configDir.mkdirs()

            def devConfig = file('config/application-development.yml')
            if (!devConfig.exists()) {
                devConfig.text = """# Development environment configuration
spring:
  profiles:
    active: development
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    io.github.alvinchiu.gstreamgate: DEBUG
    org.springframework.web: DEBUG

# gRPC proxy configuration
grpc:
  proxy:
    server:
      port: 9092

server:
  port: 5888
"""
                logger.info("✅ Created development configuration")
            }
        }

        logger.info("🚀 Development environment setup completed!")
        logger.info("   Run: ./gradlew runDev")
    }
}

// 列出所有可用任務
task listTasks {
    group = 'help'
    description = 'List all available tasks by group'

    doLast {
        def tasksByGroup = [:]

        project.tasks.each { task ->
            def group = task.group ?: 'other'
            if (!tasksByGroup[group]) {
                tasksByGroup[group] = []
            }
            tasksByGroup[group] << task.name
        }

        logger.info("""
        ==========================================
        📋 Available Tasks by Group
        ==========================================
        """)

        tasksByGroup.sort().each { group, tasks ->
            logger.info("\n${group.toUpperCase()}:")
            tasks.sort().each { taskName ->
                def task = project.tasks.findByName(taskName)
                def desc = task?.description ?: 'No description'
                logger.info("  ${taskName.padRight(25)} - ${desc}")
            }
        }

        logger.info("\n==========================================")
        logger.info("💡 Use './gradlew <task-name>' to run a task")
        logger.info("💡 Use './gradlew <task-name> --info' for verbose output")
    }
}

// 健康檢查
task healthCheck {
    group = 'verification'
    description = 'Perform comprehensive health check'

    doLast {
        logger.info("🏥 Performing health check...")

        def issues = []
        def warnings = []

        // 檢查 Java 版本
        def javaVersion = System.getProperty('java.version')
        if (!javaVersion.startsWith('21')) {
            warnings << "Java version is ${javaVersion}, recommended: 21"
        }

        // 檢查必要文件
        def requiredFiles = [
                'src/main/java/io/github/alvinchiu/gstreamgate/GStreamGateApplication.java',
                'src/main/resources/application.yml',
                'build.gradle'
        ]

        requiredFiles.each { filePath ->
            if (!file(filePath).exists()) {
                issues << "Missing required file: ${filePath}"
            }
        }

        // 檢查前端（如果啟用）
        if (project.hasProperty('frontendEnabled') && project.frontendEnabled) {
            if (!file('frontend/package.json').exists()) {
                issues << "Frontend enabled but package.json not found"
            }
        }

        // 報告結果
        if (issues.isEmpty() && warnings.isEmpty()) {
            logger.info("✅ Health check passed - no issues found")
        } else {
            if (!issues.isEmpty()) {
                logger.error("❌ Critical issues found:")
                issues.each { issue ->
                    logger.error("  - ${issue}")
                }
            }

            if (!warnings.isEmpty()) {
                logger.warn("⚠️  Warnings:")
                warnings.each { warning ->
                    logger.warn("  - ${warning}")
                }
            }
        }

        logger.info("🏥 Health check completed")
    }
}

// ==========================================
// 安全掃描任務
// ==========================================
task securityScan {
    group = 'verification'
    description = 'Run security vulnerability scan'
    dependsOn 'dependencyCheckAnalyze'

    doLast {
        def reportDir = file("${buildDir}/reports/dependency-check")
        if (reportDir.exists()) {
            logger.info("🔒 Security scan completed")
            logger.info("Report available at: ${reportDir}/dependency-check-report.html")
        } else {
            logger.warn("⚠️  Security scan report not found")
        }
    }
}

// ==========================================
// 效能分析任務
// ==========================================
task analyzePerformance {
    group = 'analysis'
    description = 'Analyze build and runtime performance'

    doLast {
        logger.info("📊 Performance Analysis")
        logger.info("=" * 50)

        // 分析建置時間
        def buildStart = gradle.buildStarted
        def now = new Date()
        if (buildStart) {
            def buildTime = now.time - buildStart.time
            logger.info("Build duration: ${buildTime}ms")
        }

        // 分析內存使用
        def runtime = Runtime.getRuntime()
        def maxMemory = runtime.maxMemory()
        def totalMemory = runtime.totalMemory()
        def freeMemory = runtime.freeMemory()
        def usedMemory = totalMemory - freeMemory

        logger.info("Memory analysis:")
        logger.info("- Used: ${usedMemory / 1024 / 1024} MB")
        logger.info("- Free: ${freeMemory / 1024 / 1024} MB")
        logger.info("- Total: ${totalMemory / 1024 / 1024} MB")
        logger.info("- Max: ${maxMemory / 1024 / 1024} MB")
        logger.info("- Usage: ${(usedMemory * 100 / maxMemory).round(2)}%")

        // 分析依賴數量
        def compileClasspath = configurations.compileClasspath
        def testClasspath = configurations.testCompileClasspath

        try {
            def compileDeps = compileClasspath.resolvedConfiguration.resolvedArtifacts.size()
            def testDeps = testClasspath.resolvedConfiguration.resolvedArtifacts.size()

            logger.info("Dependencies:")
            logger.info("- Compile: ${compileDeps}")
            logger.info("- Test: ${testDeps}")
        } catch (Exception e) {
            logger.warn("Could not analyze dependencies: ${e.message}")
        }

        // 分析項目大小
        def srcDir = file('src')
        if (srcDir.exists()) {
            def javaFiles = fileTree('src/main/java').include('**/*.java').files.size()
            def resourceFiles = fileTree('src/main/resources').files.size()
            def testFiles = fileTree('src/test/java').include('**/*.java').files.size()

            logger.info("Project size:")
            logger.info("- Java files: ${javaFiles}")
            logger.info("- Resource files: ${resourceFiles}")
            logger.info("- Test files: ${testFiles}")
        }

        logger.info("=" * 50)
    }
}

// ==========================================
// 清理和重置任務
// ==========================================
task resetProject(type: Delete) {
    group = 'build'
    description = 'Reset project to clean state (DANGEROUS)'

    delete 'build'
    delete '.gradle'
    delete 'logs'
    delete fileTree('.') {
        include '**/*.log'
        include '**/.DS_Store'
        include '**/Thumbs.db'
    }

    // 清理前端產物（但保留源碼）
    delete 'frontend/build'
    delete 'frontend/dist'
    delete 'frontend/node_modules'

    // 清理靜態資源（但保留 .gitkeep）
    delete fileTree('src/main/resources/static') {
        exclude '.gitkeep'
    }

    doFirst {
        logger.warn("⚠️  This will delete all build artifacts and caches!")
        logger.warn("⚠️  Make sure you have committed your changes!")
    }

    doLast {
        logger.info("🔄 Project reset completed")
        logger.info("💡 Run './gradlew setupDev' to reconfigure development environment")
    }
}

