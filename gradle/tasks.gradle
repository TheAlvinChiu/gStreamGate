task createRelease {
    group = 'publishing'
    description = 'Create a release package'
    dependsOn 'build', 'createStartScript'

    doLast {
        def releaseDir = file("${buildDir}/release")
        releaseDir.mkdirs()

        // 複製 JAR 文件
        copy {
            from bootJar.archiveFile
            into releaseDir
            rename { 'gstream-gate.jar' }
        }

        // 複製啟動腳本
        copy {
            from "${buildDir}/scripts"
            into "${releaseDir}/scripts"
        }

        // 複製文檔
        copy {
            from '.'
            into releaseDir
            include 'README.md'
            include 'DOCKER-QUICKSTART.md'
            include 'LICENSE*'
        }

        // 創建版本資訊文件
        def versionFile = file("${releaseDir}/VERSION.txt")
        versionFile.text = """gStreamGate Release Information
====================================
Version: ${project.version}
Build Date: ${new Date()}
Java Version: ${System.getProperty('java.version')}
Spring Boot: ${project.ext.springBootVersion}
Frontend Included: ${project.hasProperty('frontendEnabled') ? project.frontendEnabled : false}

Files Included:
- gstream-gate.jar (Main application)
- scripts/start.sh (Linux/Mac startup script)
- scripts/start.bat (Windows startup script)
- README.md (Documentation)
- DOCKER-QUICKSTART.md (Docker guide)

Quick Start:
1. Ensure Java 21+ is installed
2. Run: java -jar gstream-gate.jar
3. Or use: ./scripts/start.sh (Linux/Mac) or scripts\\start.bat (Windows)
4. Access: http://localhost:8080

For more information, see README.md
"""

        logger.info("📦 Release package created in: ${releaseDir}")
        logger.info("Contents:")
        fileTree(releaseDir).each { file ->
            def relativePath = releaseDir.toPath().relativize(file.toPath())
            logger.info("  - ${relativePath}")
        }
    }
}

