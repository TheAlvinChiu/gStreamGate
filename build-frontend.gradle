// 前端檢查和條件式建置
// ==========================================

// 檢查前端環境
ext.hasFrontend = file('frontend').exists() && file('frontend/package.json').exists()
ext.hasNode = false

try {
    def nodeVersionResult = new ByteArrayOutputStream()
    exec {
        commandLine 'node', '--version'
        standardOutput = nodeVersionResult
        ignoreExitValue = true
    }
    ext.hasNode = nodeVersionResult.toString().trim().startsWith('v')
} catch (Exception ignored) {
    ext.hasNode = false
}

println """
==========================================
📦 Frontend Build Environment Check
==========================================
Frontend directory: ${hasFrontend ? '✅ Found' : '❌ Not found'}
Node.js available:   ${hasNode ? '✅ Available' : '❌ Not available'}
Frontend build:      ${hasFrontend && hasNode ? '🔨 Will build' : '⚠️  Will skip'}
==========================================
"""

// ==========================================
// 條件式前端建置任務
// ==========================================

if (hasFrontend && hasNode) {
    println "🚀 Enabling frontend build tasks"

    task installNodeModules(type: Exec) {
        group = 'frontend'
        description = 'Install frontend dependencies'

        workingDir 'frontend'
        commandLine 'npm', 'install'

        inputs.files('frontend/package.json', 'frontend/package-lock.json')
        outputs.dir('frontend/node_modules')

        doFirst {
            logger.info('📦 Installing frontend dependencies...')
        }

        doLast {
            logger.info('✅ Frontend dependencies installed')
        }
    }

    task buildFrontend(type: Exec) {
        group = 'frontend'
        description = 'Build React frontend with create-react-app'
        dependsOn installNodeModules

        workingDir 'frontend'
        commandLine 'npm', 'run', 'build'

        inputs.dir('frontend/src')
        inputs.dir('frontend/public')
        inputs.files('frontend/package.json', 'frontend/tailwind.config.js', 'frontend/postcss.config.js')
        outputs.dir('frontend/build')

        doFirst {
            logger.info('🔨 Building React frontend...')
        }

        doLast {
            // 清理舊的靜態資源（保留 .gitkeep）
            delete fileTree('src/main/resources/static') {
                exclude '.gitkeep'
            }

            // 複製 React 建置結果
            copy {
                from 'frontend/build'
                into 'src/main/resources/static'
            }

            logger.info('✅ React frontend build completed and copied to static resources')
        }
    }

    task cleanFrontend(type: Delete) {
        group = 'frontend'
        description = 'Clean frontend build artifacts'

        delete 'frontend/build'
        delete 'frontend/node_modules'
        delete fileTree('src/main/resources/static') {
            exclude '.gitkeep'
        }
    }

    // 整合到主建置流程
    processResources.dependsOn buildFrontend
    bootJar.dependsOn buildFrontend
    clean.dependsOn cleanFrontend

} else {
    // 建立空任務避免依賴錯誤
    task installNodeModules {
        group = 'frontend'
        description = 'Install frontend dependencies (skipped)'
        doLast {
            if (!hasFrontend) {
                logger.warn('⚠️  Frontend directory not found at ./frontend/')
                logger.warn('💡 Create frontend with: npx create-react-app frontend')
            } else if (!hasNode) {
                logger.warn('⚠️  Node.js not found, skipping frontend build')
                logger.warn('💡 Install Node.js from https://nodejs.org/')
            }
        }
    }

    task buildFrontend {
        group = 'frontend'
        description = 'Build frontend (skipped - requirements not met)'
        dependsOn installNodeModules

        doLast {
            logger.warn('⚠️  Frontend build skipped')
        }
    }

    task cleanFrontend(type: Delete) {
        group = 'frontend'
        description = 'Clean frontend artifacts (limited)'

        delete fileTree('src/main/resources/static') {
            exclude '.gitkeep'
        }
    }
}

// 檢查前端建置狀態
task checkFrontend {
    group = 'verification'
    description = 'Check frontend build status and environment'

    doLast {
        def frontendDir = file('frontend')
        def packageJson = file('frontend/package.json')
        def nodeModules = file('frontend/node_modules')
        def buildDir = file('frontend/build')
        def staticFiles = file('src/main/resources/static/index.html')

        println """
        📋 Frontend Environment Status
        ==========================================
        Frontend directory:     ${frontendDir.exists() ? '✅' : '❌'}
        package.json:           ${packageJson.exists() ? '✅' : '❌'}
        node_modules:           ${nodeModules.exists() ? '✅' : '❌'}
        React build output:     ${buildDir.exists() ? '✅' : '❌'}
        Static files copied:    ${staticFiles.exists() ? '✅' : '❌'}
        Node.js available:      ${hasNode ? '✅' : '❌'}
        ==========================================
        """

        if (!frontendDir.exists()) {
            println "💡 To create frontend: npx create-react-app frontend"
        } else if (!hasNode) {
            println "💡 To install Node.js: https://nodejs.org/"
        } else if (!nodeModules.exists()) {
            println "💡 To install dependencies: ./gradlew installNodeModules"
        } else if (!buildDir.exists()) {
            println "💡 To build frontend: ./gradlew buildFrontend"
        }
    }
}
